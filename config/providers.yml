# Which adapter serves which capability, per environment, plus free-tier budgets.
# `fixture` never touches the network or the budget. Live adapters only run when LIVE_DATA=true.
shared:
  budgets:
    sports_game_odds:
      monthly_units: 2500      # free tier "objects" (one per event returned)
      ceiling: 0.8             # plan to use at most 80%
      min_interval: 6.5        # seconds between calls (10 req/min)
    balldontlie:
      monthly_units: null      # rate-limited only (5 req/min free)
      min_interval: 12.5

default: &default
  odds: sports_game_odds
  props: sports_game_odds
  reference: balldontlie
  stats: balldontlie

development:
  odds: fixture
  props: fixture
  reference: fixture
  stats: fixture

test:
  odds: fixture
  props: fixture
  reference: fixture
  stats: fixture

production:
  <<: *default

# Times are US Eastern. Live jobs no-op unless LIVE_DATA=true.
production:
  sync_reference_data:
    class: SyncReferenceDataJob
    schedule: 0 6 * * * America/New_York
  ingest_game_logs:
    class: IngestGameLogsJob
    schedule: 0 4 * * * America/New_York
  odds_morning:
    class: SnapshotOddsJob
    args: ["morning"]
    schedule: 0 10 * * * America/New_York
  odds_afternoon:
    class: SnapshotOddsJob
    args: ["afternoon"]
    schedule: 0 15 * * * America/New_York
  odds_tick:
    class: SnapshotOddsJob
    args: ["tick"]
    schedule: "*/10 * * * *"
  mark_closing_lines:
    class: MarkClosingLinesJob
    schedule: "5-55/10 * * * *"
  compute_defense_ranks:
    class: ComputeDefenseRanksJob
    schedule: 30 4 * * * America/New_York
  precompute_hit_rates:
    class: PrecomputeHitRatesJob
    schedule: 45 4 * * * America/New_York
  generate_insights:
    class: GenerateInsightsJob
    schedule: 50 4 * * * America/New_York
  purge_raw_payloads:
    class: PurgeRawPayloadsJob
    schedule: 30 5 * * *
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

development:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
